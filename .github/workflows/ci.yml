name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # A short run per target catches regressions that make previously valid
      # inputs panic. Long campaigns belong in a scheduled job, not in CI.
      - name: Fuzz targets
        run: |
          for target in '^FuzzOpen$' '^FuzzOpenPath$' '^FuzzParseDirectoryEntries$' '^FuzzFragmentOffsets$' '^FuzzScanOrphans$'; do
            echo "== $target"
            go test -run XXX -fuzz "$target" -fuzztime 30s .
          done

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # staticcheck reads the compiler's export data and must know its format.
      # Floating both Go (stable) and staticcheck (latest) broke this job when
      # go1.27.2 shipped a format staticcheck v0.8.1 cannot decode. Pin the pair
      # and move them together; the test jobs above still track stable Go.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Run staticcheck
        run: staticcheck ./...
